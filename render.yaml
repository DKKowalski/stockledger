services:
  - type: web
    name: stockledger-dkk-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run api:build && npm run api:migrate
    startCommand: npm run start:prod --workspace=apps/api
    initialDeployHook: npm run db:seed:prod --workspace=apps/api
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://stockledger-dkk-web.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: PASSWORD_RESET_TTL_MINUTES
        value: 30
      - key: EMAIL_VERIFICATION_TTL_HOURS
        value: 24
      - key: INVITATION_TTL_HOURS
        value: 72
      - key: DEMO_COMPANY_ID
        value: 31000000-0000-4000-8000-000000000001
      - key: SENTRY_DSN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: stockledger-dkk-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run web:build
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - package-lock.json
    envVars:
      - key: VITE_API_URL
        value: https://stockledger-dkk-api.onrender.com
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SUPPORT_EMAIL
        value: accounts@e9magazine.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
